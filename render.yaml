services:
  - type: web
    name: hustle-api
    runtime: python
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./hustle.db"
      - key: JWT_SECRET
        value: "hustle-secret-key-production-32-chars-long"
      - key: PHONE_HASH_PEPPER
        value: "hustle-pepper-secret-32-chars-long"
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: buku-web
    runtime: static
    region: frankfurt
    rootDir: web
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
